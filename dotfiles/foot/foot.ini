# Cấu hình foot.ini cho anh Q

[main]
# Font và cỡ chữ
font=FiraCode Nerd Font Mono:size=11
# Độ nhòe/trong suốt của background (0.65 tương đương với khoảng hex a6 hoặc alpha trong foot)
alpha=0.65

[cursor]
# Hiệu ứng đuôi con trỏ (foot quản lý qua độ mượt/style di chuyển thay vì trail đếm số như kitty)
style=block
blink=yes

[key-bindings]
# Ánh xạ tính năng ctrl+f mở fuzzyvim trong thư mục hiện tại bằng cách gọi một cửa sổ foot mới
# (Lưu ý: foot không có overlay nên nó sẽ mở ra một cửa sổ nổi/mới tùy theo cấu hình Window Manager của anh)
control+f=spawn-terminal-cwd zsh -i -c fuzzyvim
